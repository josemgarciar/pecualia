name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pecualia_ci
          POSTGRES_USER: pecualia_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pecualia_ci -d pecualia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PECUALIA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=pecualia_ci;Username=pecualia_ci;Password=isolated-ci-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend dependencies
        run: dotnet restore Pecualia.sln

      - name: Build backend
        run: dotnet build Pecualia.sln --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test src/backend/Pecualia.Test/Pecualia.Test.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend

      - name: Check frontend identifiers
        run: npm run lint
        working-directory: src/frontend

      - name: Run frontend tests
        run: npm test
        working-directory: src/frontend
